services:
  postgres:
    image: postgres:16-alpine
    container_name: smartparking-postgres
    environment:
      POSTGRES_DB: smartparking
      POSTGRES_USER: smartparking
      POSTGRES_PASSWORD: smartparking
    ports:
      # Porta do host configuravel: em maquinas que ja rodam um Postgres local,
      # use POSTGRES_PORT=5433 docker compose up -d (e ajuste DB_URL no backend).
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartparking -d smartparking"]
      interval: 5s
      timeout: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: smartparking-mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./infra/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log

volumes:
  postgres-data:
  mosquitto-data:
  mosquitto-log:
