server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # O navegador so compila WebAssembly em streaming com o MIME correto.
    types {
        application/wasm wasm;
        application/javascript js mjs;
        text/html html;
        text/css css;
        application/json json;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
