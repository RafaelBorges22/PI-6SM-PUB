# Broker MQTT do Smart Parking (Eclipse Mosquitto 2.x)

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Porta MQTT padrao usada pelo ESP32 e pelo backend Spring Boot
listener 1883
protocol mqtt

# Porta WebSocket (util para clientes de teste no navegador)
listener 9001
protocol websockets

# Ambiente academico/laboratorio: sem autenticacao no broker.
# Em producao trocar por "allow_anonymous false" + password_file.
allow_anonymous true
